apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: unf-agent
  namespace: unf-system
spec:
  template:
    spec:
      hostPID: true
      initContainers:
        - name: install-primary-cni
          image: localhost/unf-agent:dev
          imagePullPolicy: Never
          command: [/bin/sh, /opt/unf/install/install.sh]
          securityContext:
            privileged: true
          volumeMounts:
            - name: cni-install
              mountPath: /opt/unf/install
              readOnly: true
            - name: cni-bin
              mountPath: /host/opt/cni/bin
            - name: cni-config
              mountPath: /host/etc/cni/net.d
            - name: cni-state
              mountPath: /host/var/lib/unf/cni
            - name: cni-run
              mountPath: /host/run/unf
      containers:
        - name: agent
          args:
            - --listen
            - 0.0.0.0:9963
            - --all-interfaces
            - --hook-coverage
            - both
            - --ebpf-object
            - /opt/unf/ebpf/unf-ebpf-tc
            - --bpf-pin-path
            - /sys/fs/bpf/unf/v13
            - --controller-url
            - https://unf-controller.unf-system.svc.cluster.local:9964
            - --controller-ca-path
            - /var/run/secrets/unf-internal-ca/ca.crt
            - --cni-socket
            - /run/unf/cni.sock
            - --cni-status-lease-path
            - /run/unf/cni-status.lease
            - --cni-status-heartbeat-seconds
            - "2"
            - --cni-native-ipv4-uplink
            - eth0
            - --cni-native-ipv6-uplink
            - eth0
          volumeMounts:
            - name: cni-state
              mountPath: /var/lib/unf/cni
            - name: cni-run
              mountPath: /run/unf
            - name: host-netns
              mountPath: /var/run/netns
              mountPropagation: HostToContainer
      volumes:
        - name: cni-install
          configMap:
            name: unf-cni-install
            defaultMode: 0555
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
            type: Directory
        - name: cni-config
          hostPath:
            path: /etc/cni/net.d
            type: Directory
        - name: cni-state
          hostPath:
            path: /var/lib/unf/cni
            type: DirectoryOrCreate
        - name: cni-run
          hostPath:
            path: /run/unf
            type: DirectoryOrCreate
        - name: host-netns
          hostPath:
            path: /var/run/netns
            type: DirectoryOrCreate
