apiVersion: apps/v1
kind: Deployment
metadata:
  name: unf-controller
  namespace: unf-system
spec:
  # A host-network singleton with fixed ports cannot overlap its replacement on
  # the pinned control-plane Node. Stop it before starting the next revision.
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        openshift.io/required-scc: unf-primary-controller
    spec:
      hostNetwork: true
      dnsPolicy: Default
      nodeName: unf-primary-controller-node.invalid
      tolerations:
        - operator: Exists
      containers:
        - name: controller
          imagePullPolicy: IfNotPresent
          # The controller must be able to bootstrap while UNF's Service
          # dataplane is unavailable on a rebooting host. The deployment gate
          # replaces this sentinel with Infrastructure.status.apiServerInternalURI.
          env:
            - name: KUBERNETES_SERVICE_HOST
              value: unf-primary-apiserver.internal.invalid
            - name: KUBERNETES_SERVICE_PORT
              value: "16443"
            - name: KUBERNETES_SERVICE_PORT_HTTPS
              value: "16443"
          # Initial relist/restore after broad Pod churn can hold the controller
          # longer than the generic one-second probe budget. Keep liveness
          # disabled until one health response succeeds, then tolerate bounded
          # transient reconciliation pressure without masking a lasting stall.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6
