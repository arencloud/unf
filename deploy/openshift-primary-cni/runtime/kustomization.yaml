apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../crds
  - ../../kubernetes
  - primary-scc.yaml
  - primary-host-mount-policy.yaml
configMapGenerator:
  - name: unf-cni-install
    namespace: unf-system
    files:
      - 10-unf.conflist
      - install.sh
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: localhost/unf-controller:dev
    newName: quay.io/arencloud/unf-controller-dev
    digest: sha256:45737844f39bd84b0e1929013ee01e8f364aa8d90fd8eb20430ad8d60e3cdb45
  - name: localhost/unf-agent:dev
    newName: quay.io/arencloud/unf-agent-dev
    digest: sha256:822f79780fc28d46ff9a7e1a9127d43319a6b7368ece225cfcd883d8c5a74c52
patches:
  - path: controller-patch.yaml
  - path: agent-patch.yaml
