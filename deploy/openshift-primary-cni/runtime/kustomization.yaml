apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../crds
  - ../../kubernetes
  - primary-scc.yaml
  - primary-host-mount-policy.yaml
configMapGenerator:
  - name: unf-cni-install
    namespace: unf-system
    files:
      - 10-unf.conflist
      - install.sh
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: localhost/unf-controller:dev
    newName: quay.io/arencloud/unf-controller-dev
    digest: sha256:d212b8ba7124def5c363582aa1f667e1e8e62fb003b4f52f09d21464c68bb4c6
  - name: localhost/unf-agent:dev
    newName: quay.io/arencloud/unf-agent-dev
    digest: sha256:4d0ab82012a4f7502dfe80978d4c0fd2619d0d7905b9ed838f37d7ee46d6e5dc
patches:
  - path: controller-patch.yaml
  - path: agent-patch.yaml
