apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../crds
  - ../../kubernetes
  - primary-scc.yaml
  - primary-host-mount-policy.yaml
configMapGenerator:
  - name: unf-cni-install
    namespace: unf-system
    files:
      - 10-unf.conflist
      - install.sh
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: localhost/unf-controller:dev
    newName: quay.io/arencloud/unf-controller-dev
    digest: sha256:f284b96d10846adf0514e69059a0e78bfcfce1695476fad5c9603bafc9f83196
  - name: localhost/unf-agent:dev
    newName: quay.io/arencloud/unf-agent-dev
    digest: sha256:5e1dfa25fef25d9452bcdd16212d498e6a4c3371c640bd8d552cbab0e42d8b45
patches:
  - path: controller-patch.yaml
  - path: agent-patch.yaml
