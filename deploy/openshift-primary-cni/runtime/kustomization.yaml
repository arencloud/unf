apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../crds
  - ../../kubernetes
  - primary-scc.yaml
  - primary-host-mount-policy.yaml
configMapGenerator:
  - name: unf-cni-install
    namespace: unf-system
    files:
      - 10-unf.conflist
      - install.sh
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: localhost/unf-controller:dev
    newName: quay.io/arencloud/unf-controller-dev
    digest: sha256:02a719b79c7e6f9c27e7ae7a63ee70fa2d02a17734a765d9cf41e5576d0a6e0c
  - name: localhost/unf-agent:dev
    newName: quay.io/arencloud/unf-agent-dev
    digest: sha256:d958d99fbdc09fb1f72c9949f3cc9ce533dedb0dfab0ce4a7634c34aa7b059bf
patches:
  - path: controller-patch.yaml
  - path: agent-patch.yaml
