apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../crds
  - ../../kubernetes
  - primary-scc.yaml
  - primary-host-mount-policy.yaml
configMapGenerator:
  - name: unf-cni-install
    namespace: unf-system
    files:
      - 10-unf.conflist
      - install.sh
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: localhost/unf-controller:dev
    newName: quay.io/arencloud/unf-controller-dev
    digest: sha256:a9ee0f2c33229394591d32b7e6311efe73c2222e13a4d3270276ecfcb4e82062
  - name: localhost/unf-agent:dev
    newName: quay.io/arencloud/unf-agent-dev
    digest: sha256:48e3b72c620eeeb116b36b503dd5a468313f2d7e68608bdc329b6decb7f87ade
patches:
  - path: controller-patch.yaml
  - path: agent-patch.yaml
