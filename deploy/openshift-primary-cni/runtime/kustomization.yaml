apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../crds
  - ../../kubernetes
  - primary-scc.yaml
  - primary-host-mount-policy.yaml
configMapGenerator:
  - name: unf-cni-install
    namespace: unf-system
    files:
      - 10-unf.conflist
      - install.sh
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: localhost/unf-controller:dev
    newName: quay.io/arencloud/unf-controller-dev
    digest: sha256:719045c1e0e1807d7893a7980c946e7e974c06ca6a205eb07f7d3d0e720c8e80
  - name: localhost/unf-agent:dev
    newName: quay.io/arencloud/unf-agent-dev
    digest: sha256:4c2ddad9e466b002a80e0f801de47851355dfa7174522bcf7c6521e6f8f6a5f3
patches:
  - path: controller-patch.yaml
  - path: agent-patch.yaml
