apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../crds
  - ../../kubernetes
  - primary-scc.yaml
  - primary-host-mount-policy.yaml
configMapGenerator:
  - name: unf-cni-install
    namespace: unf-system
    files:
      - 10-unf.conflist
      - install.sh
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: localhost/unf-controller:dev
    newName: quay.io/arencloud/unf-controller-dev
    digest: sha256:d056a16560656d53974a5b4393627716e203473e08ed5575e3c8679b6639d2c9
  - name: localhost/unf-agent:dev
    newName: quay.io/arencloud/unf-agent-dev
    digest: sha256:ed4904a70bc2b17e9a88e4f297dc4e16769d7e65dba16dfb1a82002bf13da37e
patches:
  - path: controller-patch.yaml
  - path: agent-patch.yaml
