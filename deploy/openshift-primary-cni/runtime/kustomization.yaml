apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../crds
  - ../../kubernetes
  - primary-scc.yaml
  - primary-host-mount-policy.yaml
configMapGenerator:
  - name: unf-cni-install
    namespace: unf-system
    files:
      - 10-unf.conflist
      - install.sh
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: localhost/unf-controller:dev
    newName: quay.io/arencloud/unf-controller-dev
    digest: sha256:0d85ebb7a4d8f30a40c979372e50ff63a7616594a35366cb385287b139583f96
  - name: localhost/unf-agent:dev
    newName: quay.io/arencloud/unf-agent-dev
    digest: sha256:34a85f5af5cb5cc465b1d1dbea67d8c9c9809218a4bce719c411f46fb4c1b48b
patches:
  - path: controller-patch.yaml
  - path: agent-patch.yaml
