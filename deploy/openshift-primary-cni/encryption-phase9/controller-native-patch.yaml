apiVersion: apps/v1
kind: Deployment
metadata:
  name: unf-controller
  namespace: unf-system
spec:
  template:
    spec:
      containers:
        - name: controller
          env:
            # Existing installations retain their qualified plaintext path
            # until the guarded Phase 9 migration proves fleet readiness.
            - name: UNF_ENCRYPTION_BASELINE
              value: native
