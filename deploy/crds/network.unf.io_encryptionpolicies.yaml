apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: encryptionpolicies.network.unf.io
spec:
  group: network.unf.io
  names:
    kind: EncryptionPolicy
    plural: encryptionpolicies
    shortNames:
    - unfenc
    singular: encryptionpolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for EncryptionPolicySpec via `CustomResource`
        properties:
          spec:
            description: |-
              Selects identity pairs that must use the attested encryption fabric when
              the cluster baseline is `Native`. A `Required` baseline remains monotonic:
              policies add provenance but can never weaken cluster-wide encryption.
            properties:
              bidirectional:
                default: true
                description: |-
                  Emit the exact reverse identity-pair intent as part of the same atomic
                  policy. This is default-on because most request/reply transports need
                  symmetric underlay confidentiality.
                type: boolean
              destinations:
                properties:
                  application:
                    nullable: true
                    type: string
                  matchLabels:
                    additionalProperties:
                      type: string
                    default: {}
                    type: object
                  namespace:
                    nullable: true
                    type: string
                  serviceAccount:
                    nullable: true
                    type: string
                type: object
              priority:
                default: 1000
                format: uint32
                minimum: 0.0
                type: integer
              sources:
                properties:
                  application:
                    nullable: true
                    type: string
                  matchLabels:
                    additionalProperties:
                      type: string
                    default: {}
                    type: object
                  namespace:
                    nullable: true
                    type: string
                  serviceAccount:
                    nullable: true
                    type: string
                type: object
            required:
            - destinations
            - sources
            type: object
        required:
        - spec
        title: EncryptionPolicy
        type: object
    served: true
    storage: true
