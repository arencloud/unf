apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: unf-agent-daemonset-host-mounts
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: unf-system
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["daemonsets"]
        scope: Namespaced
  matchConditions:
    - name: unf-agent-daemonset-or-service-account
      expression: >-
        object.metadata.name == 'unf-agent' ||
        object.spec.template.spec.serviceAccountName == 'unf-agent'
  variables:
    - name: podSpec
      expression: object.spec.template.spec
  validations:
    - expression: >-
        object.metadata.name != 'unf-agent' ||
        variables.podSpec.serviceAccountName == 'unf-agent'
      message: the unf-agent DaemonSet must retain the unf-agent service account
    - expression: >-
        has(variables.podSpec.volumes) &&
        variables.podSpec.volumes.filter(volume, has(volume.hostPath)).size() == 2 &&
        variables.podSpec.volumes.exists(volume,
          volume.name == 'bpffs' && has(volume.hostPath) &&
          volume.hostPath.path == '/sys/fs/bpf' && volume.hostPath.type == 'Directory') &&
        variables.podSpec.volumes.exists(volume,
          volume.name == 'btf' && has(volume.hostPath) &&
          volume.hostPath.path == '/sys/kernel/btf' && volume.hostPath.type == 'Directory')
      message: >-
        unf-agent must use exactly the bpffs=/sys/fs/bpf and
        btf=/sys/kernel/btf Directory hostPath volumes
    - expression: >-
        variables.podSpec.containers.exists(container,
          container.name == 'agent' && has(container.volumeMounts) &&
          container.volumeMounts.filter(mount, mount.name in ['bpffs', 'btf']).size() == 2 &&
          container.volumeMounts.exists(mount,
            mount.name == 'bpffs' && mount.mountPath == '/sys/fs/bpf' &&
            (!has(mount.readOnly) || !mount.readOnly) &&
            (!has(mount.subPath) || mount.subPath == '') &&
            (!has(mount.subPathExpr) || mount.subPathExpr == '') &&
            (!has(mount.mountPropagation) || mount.mountPropagation == 'None')) &&
          container.volumeMounts.exists(mount,
            mount.name == 'btf' && mount.mountPath == '/sys/kernel/btf' &&
            has(mount.readOnly) && mount.readOnly &&
            (!has(mount.subPath) || mount.subPath == '') &&
            (!has(mount.subPathExpr) || mount.subPathExpr == '') &&
            (!has(mount.mountPropagation) || mount.mountPropagation == 'None')))
      message: >-
        the agent container must mount bpffs read/write at /sys/fs/bpf and BTF
        read-only at /sys/kernel/btf without subpaths or mount propagation
    - expression: >-
        variables.podSpec.containers.all(container,
          container.name == 'agent' || !has(container.volumeMounts) ||
          container.volumeMounts.all(mount, !(mount.name in ['bpffs', 'btf']))) &&
        (!has(variables.podSpec.initContainers) ||
          variables.podSpec.initContainers.all(container,
            !has(container.volumeMounts) ||
            container.volumeMounts.all(mount, !(mount.name in ['bpffs', 'btf']))))
      message: only the agent container may mount the bpffs or BTF host volumes
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: unf-agent-daemonset-host-mounts
spec:
  policyName: unf-agent-daemonset-host-mounts
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: unf-agent-pod-host-mounts
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: unf-system
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
        scope: Namespaced
  matchConditions:
    - name: unf-agent-service-account
      expression: object.spec.serviceAccountName == 'unf-agent'
  variables:
    - name: podSpec
      expression: object.spec
  validations:
    - expression: >-
        has(variables.podSpec.volumes) &&
        variables.podSpec.volumes.filter(volume, has(volume.hostPath)).size() == 2 &&
        variables.podSpec.volumes.exists(volume,
          volume.name == 'bpffs' && has(volume.hostPath) &&
          volume.hostPath.path == '/sys/fs/bpf' && volume.hostPath.type == 'Directory') &&
        variables.podSpec.volumes.exists(volume,
          volume.name == 'btf' && has(volume.hostPath) &&
          volume.hostPath.path == '/sys/kernel/btf' && volume.hostPath.type == 'Directory')
      message: >-
        unf-agent must use exactly the bpffs=/sys/fs/bpf and
        btf=/sys/kernel/btf Directory hostPath volumes
    - expression: >-
        variables.podSpec.containers.exists(container,
          container.name == 'agent' && has(container.volumeMounts) &&
          container.volumeMounts.filter(mount, mount.name in ['bpffs', 'btf']).size() == 2 &&
          container.volumeMounts.exists(mount,
            mount.name == 'bpffs' && mount.mountPath == '/sys/fs/bpf' &&
            (!has(mount.readOnly) || !mount.readOnly) &&
            (!has(mount.subPath) || mount.subPath == '') &&
            (!has(mount.subPathExpr) || mount.subPathExpr == '') &&
            (!has(mount.mountPropagation) || mount.mountPropagation == 'None')) &&
          container.volumeMounts.exists(mount,
            mount.name == 'btf' && mount.mountPath == '/sys/kernel/btf' &&
            has(mount.readOnly) && mount.readOnly &&
            (!has(mount.subPath) || mount.subPath == '') &&
            (!has(mount.subPathExpr) || mount.subPathExpr == '') &&
            (!has(mount.mountPropagation) || mount.mountPropagation == 'None')))
      message: >-
        the agent container must mount bpffs read/write at /sys/fs/bpf and BTF
        read-only at /sys/kernel/btf without subpaths or mount propagation
    - expression: >-
        variables.podSpec.containers.all(container,
          container.name == 'agent' || !has(container.volumeMounts) ||
          container.volumeMounts.all(mount, !(mount.name in ['bpffs', 'btf']))) &&
        (!has(variables.podSpec.initContainers) ||
          variables.podSpec.initContainers.all(container,
            !has(container.volumeMounts) ||
            container.volumeMounts.all(mount, !(mount.name in ['bpffs', 'btf'])))) &&
        (!has(variables.podSpec.ephemeralContainers) ||
          variables.podSpec.ephemeralContainers.all(container,
            !has(container.volumeMounts) ||
            container.volumeMounts.all(mount, !(mount.name in ['bpffs', 'btf']))))
      message: >-
        only the agent container may mount the bpffs or BTF host volumes;
        init and ephemeral containers may not mount them
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: unf-agent-pod-host-mounts
spec:
  policyName: unf-agent-pod-host-mounts
  validationActions: [Deny]
