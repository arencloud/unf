apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: unf-controller
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "services/status"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["unf-agent-acknowledgements", "unf-flow-history", "unf-topology-history", "unf-load-balancer-control-plane", "unf-load-balancer-status-ownership", "unf-egress-desired-state", "unf-egress-control-plane"]
    verbs: ["get", "patch"]
  - apiGroups: ["network.unf.io"]
    resources: ["securitypolicies", "egresspools", "egresspolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["network.unf.io"]
    resources: ["securitypolicies/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["k8s.ovn.org"]
    resources: ["egressips"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: unf-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: unf-controller
subjects:
  - kind: ServiceAccount
    name: unf-controller
    namespace: unf-system
