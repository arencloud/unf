apiVersion: apps/v1
kind: Deployment
metadata:
  name: unf-controller
  namespace: unf-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unf-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unf-controller
    spec:
      serviceAccountName: unf-controller
      containers:
        - name: controller
          image: localhost/unf-controller:dev
          imagePullPolicy: Never
          args: ["--listen", "0.0.0.0:9962"]
          ports:
            - name: http
              containerPort: 9962
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
