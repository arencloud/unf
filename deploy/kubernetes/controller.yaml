apiVersion: apps/v1
kind: Deployment
metadata:
  name: unf-controller
  namespace: unf-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unf-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unf-controller
    spec:
      serviceAccountName: unf-controller
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: controller
          image: localhost/unf-controller:dev
          imagePullPolicy: Never
          args:
            - --listen
            - 0.0.0.0:9962
            - --internal-listen
            - 0.0.0.0:9964
            - --tls-cert
            - /var/run/secrets/unf-internal-tls/tls.crt
            - --tls-key
            - /var/run/secrets/unf-internal-tls/tls.key
          ports:
            - name: http
              containerPort: 9962
            - name: https-internal
              containerPort: 9964
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: internal-tls
              mountPath: /var/run/secrets/unf-internal-tls
              readOnly: true
      volumes:
        - name: internal-tls
          secret:
            secretName: unf-internal-tls
            defaultMode: 0440
