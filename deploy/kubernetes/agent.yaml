apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: unf-agent
  namespace: unf-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: unf-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unf-agent
    spec:
      serviceAccountName: unf-agent
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        # A per-node fabric agent must also run on tainted control-plane and
        # infrastructure nodes so coverage does not silently develop gaps.
        - operator: Exists
      containers:
        - name: agent
          image: localhost/unf-agent:dev
          imagePullPolicy: Never
          args:
            - --listen
            - 0.0.0.0:9963
            - --all-interfaces
            - --ebpf-object
            - /opt/unf/ebpf/unf-ebpf-tc
            - --controller-url
            - http://unf-controller.unf-system.svc.cluster.local:9962
          env:
            - name: UNF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 9963
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            # Phase 1 prototype: loading and attaching TC programs needs host
            # networking privileges. Narrow SCC/capabilities are a validation gate.
            privileged: true
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: btf
          hostPath:
            path: /sys/kernel/btf
            type: Directory
