apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: unf-agent
  namespace: unf-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: unf-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unf-agent
    spec:
      serviceAccountName: unf-agent
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        # A per-node fabric agent must also run on tainted control-plane and
        # infrastructure nodes so coverage does not silently develop gaps.
        - operator: Exists
      containers:
        - name: agent
          image: localhost/unf-agent:dev
          imagePullPolicy: Never
          args:
            - --listen
            - 0.0.0.0:9963
            - --all-interfaces
            - --ebpf-object
            - /opt/unf/ebpf/unf-ebpf-tc
            - --bpf-pin-path
            - /sys/fs/bpf/unf/v8
            - --controller-url
            - https://unf-controller.unf-system.svc.cluster.local:9964
            - --controller-ca-path
            - /var/run/secrets/unf-internal-ca/ca.crt
          env:
            - name: UNF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: UNF_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: UNF_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          ports:
            - name: http
              containerPort: 9963
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            # The portable baseline stays privileged because Kubernetes has no
            # SCC equivalent. The OpenShift overlay replaces this with an exact
            # three-capability, non-privileged container profile.
            privileged: true
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
            - name: cni-state
              mountPath: /var/lib/unf/cni
            - name: agent-token
              mountPath: /var/run/secrets/unf-agent
              readOnly: true
            - name: internal-ca
              mountPath: /var/run/secrets/unf-internal-ca
              readOnly: true
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: btf
          hostPath:
            path: /sys/kernel/btf
            type: Directory
        - name: cni-state
          hostPath:
            path: /var/lib/unf/cni
            type: DirectoryOrCreate
        - name: agent-token
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  audience: unf-controller.unf-system.svc
                  expirationSeconds: 3600
                  path: token
        - name: internal-ca
          configMap:
            name: unf-internal-ca
            defaultMode: 0444
