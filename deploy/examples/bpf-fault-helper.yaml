apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: unf-bpf-fault-helper
  namespace: unf-system
  labels:
    app.kubernetes.io/name: unf-bpf-fault-helper
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: unf-bpf-fault-helper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unf-bpf-fault-helper
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      containers:
        - name: helper
          image: localhost/unf-test-tools:ipv6-ext-v1
          imagePullPolicy: Never
          command:
            - /bin/sh
            - -c
            - exec sleep infinity
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
            - name: runtime
              mountPath: /run/unf-test
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: runtime
          emptyDir: {}
