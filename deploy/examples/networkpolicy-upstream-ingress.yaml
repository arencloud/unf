apiVersion: v1
kind: Namespace
metadata:
  name: unf-np-target
  labels:
    conformance-group: target
---
apiVersion: v1
kind: Namespace
metadata:
  name: unf-np-source-a
  labels:
    conformance-group: a
---
apiVersion: v1
kind: Namespace
metadata:
  name: unf-np-source-b
  labels:
    conformance-group: b
---
apiVersion: v1
kind: Pod
metadata:
  name: server
  namespace: unf-np-target
  labels:
    app: upstream-server
spec:
  nodeSelector:
    kubernetes.io/hostname: unf-dev-worker
  containers:
    - name: server
      image: docker.io/library/busybox:1.37.0
      command:
        - sh
        - -c
        - |
          mkdir -p /www
          echo unf-upstream-ok > /www/index.html
          httpd -p 8088 -h /www
          exec httpd -f -p 8087 -h /www
      ports:
        - name: first
          containerPort: 8087
          protocol: TCP
        - name: second
          containerPort: 8088
          protocol: TCP
---
apiVersion: v1
kind: Pod
metadata:
  name: same-client
  namespace: unf-np-target
  labels:
    conformance-source: same
spec:
  nodeSelector:
    kubernetes.io/hostname: unf-dev-control-plane
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: client
      image: docker.io/library/busybox:1.37.0
      command: ["sh", "-c", "sleep infinity"]
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: unf-np-source-a
  labels:
    conformance-source: selected
spec:
  nodeSelector:
    kubernetes.io/hostname: unf-dev-control-plane
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: client
      image: docker.io/library/busybox:1.37.0
      command: ["sh", "-c", "sleep infinity"]
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: unf-np-source-b
  labels:
    conformance-source: selected
spec:
  nodeSelector:
    kubernetes.io/hostname: unf-dev-control-plane
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: client
      image: docker.io/library/busybox:1.37.0
      command: ["sh", "-c", "sleep infinity"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-matrix
  namespace: unf-np-target
spec:
  podSelector:
    matchLabels:
      conformance-target: isolated
  policyTypes:
    - Ingress
  ingress: []
