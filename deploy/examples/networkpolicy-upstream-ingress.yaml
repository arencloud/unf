apiVersion: v1
kind: Namespace
metadata:
  name: unf-np-target
  labels:
    conformance-group: target
---
apiVersion: v1
kind: Namespace
metadata:
  name: unf-np-source-a
  labels:
    conformance-group: a
---
apiVersion: v1
kind: Namespace
metadata:
  name: unf-np-source-b
  labels:
    conformance-group: b
---
apiVersion: v1
kind: Pod
metadata:
  name: server
  namespace: unf-np-target
  labels:
    app: upstream-server
    named-port-target: "true"
spec:
  nodeSelector:
    kubernetes.io/hostname: unf-dev-worker
  containers:
    - name: server
      image: docker.io/library/busybox:1.37.0
      command:
        - sh
        - -c
        - |
          mkdir -p /www
          echo unf-upstream-ok > /www/index.html
          httpd -p 8088 -h /www
          exec httpd -f -p 8087 -h /www
      ports:
        - name: web
          containerPort: 8087
          protocol: TCP
        - name: other
          containerPort: 8088
          protocol: TCP
---
apiVersion: v1
kind: Pod
metadata:
  name: alternate-server
  namespace: unf-np-target
  labels:
    app: upstream-alternate-server
    named-port-target: "true"
spec:
  nodeSelector:
    kubernetes.io/hostname: unf-dev-control-plane
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: server
      image: docker.io/library/busybox:1.37.0
      command:
        - sh
        - -c
        - |
          mkdir -p /www
          echo unf-upstream-ok > /www/index.html
          httpd -p 8087 -h /www
          exec httpd -f -p 8088 -h /www
      ports:
        - name: other
          containerPort: 8087
          protocol: TCP
        - name: web
          containerPort: 8088
          protocol: TCP
---
apiVersion: v1
kind: Pod
metadata:
  name: protocol-server
  namespace: unf-np-target
  labels:
    app: upstream-protocol-server
    protocol-target: "true"
spec:
  nodeSelector:
    kubernetes.io/hostname: unf-dev-worker
  containers:
    - name: server
      image: localhost/unf-test-tools:ipv6-ext-v1
      imagePullPolicy: Never
      command:
        - sh
        - -c
        - |
          socat TCP4-LISTEN:8090,reuseaddr,fork EXEC:/bin/cat &
          socat TCP4-LISTEN:8091,reuseaddr,fork EXEC:/bin/cat &
          socat UDP4-RECVFROM:8091,reuseaddr,fork EXEC:/bin/cat &
          exec socat UDP4-RECVFROM:8090,reuseaddr,fork EXEC:/bin/cat
      ports:
        - name: exact-udp
          containerPort: 8090
          protocol: UDP
        - name: other-udp
          containerPort: 8091
          protocol: UDP
        - name: exact-tcp
          containerPort: 8090
          protocol: TCP
        - name: other-tcp
          containerPort: 8091
          protocol: TCP
---
apiVersion: v1
kind: Pod
metadata:
  name: same-client
  namespace: unf-np-target
  labels:
    conformance-source: same
spec:
  nodeSelector:
    kubernetes.io/hostname: unf-dev-control-plane
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: client
      image: localhost/unf-test-tools:ipv6-ext-v1
      imagePullPolicy: Never
      command: ["sh", "-c", "sleep infinity"]
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: unf-np-source-a
  labels:
    conformance-source: selected
spec:
  nodeSelector:
    kubernetes.io/hostname: unf-dev-control-plane
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: client
      image: localhost/unf-test-tools:ipv6-ext-v1
      imagePullPolicy: Never
      command: ["sh", "-c", "sleep infinity"]
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: unf-np-source-b
  labels:
    conformance-source: selected
spec:
  nodeSelector:
    kubernetes.io/hostname: unf-dev-control-plane
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: client
      image: localhost/unf-test-tools:ipv6-ext-v1
      imagePullPolicy: Never
      command: ["sh", "-c", "sleep infinity"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-matrix
  namespace: unf-np-target
spec:
  podSelector:
    matchLabels:
      conformance-target: isolated
  policyTypes:
    - Ingress
  ingress: []
